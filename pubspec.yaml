name: gossiper
description: >-
  Gossip protocol for Dart and Flutter via hashicorp/memberlist (Go) compiled
  as a native shared library and loaded with dart:ffi. Includes automatic peer
  discovery via multicast DNS (mDNS).
version: 0.1.0
repository: https://github.com/welingtonfr/gossiper
issue_tracker: https://github.com/welingtonfr/gossiper/issues
license: MIT

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

# Blobs are built by CI and included at publish time — not committed to git.
# See .github/workflows/publish.yml.
