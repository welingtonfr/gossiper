name: gossiper
description: >-
  Gossip protocol for Dart and Flutter with automatic peer discovery.
version: 0.2.0
repository: https://github.com/welingtonfr/gossiper
issue_tracker: https://github.com/welingtonfr/gossiper/issues
license: MIT

environment:
  sdk: ^3.12.2
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true

# Blobs are built by CI and included at publish time — not committed to git.
# See .github/workflows/publish.yml.
