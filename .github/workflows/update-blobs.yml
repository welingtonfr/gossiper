name: Update native blobs

# Rebuilds blobs/ whenever the Go wrapper changes and opens a PR.
on:
  push:
    branches: [master]
    paths:
      - 'native/memberlist_wrapper/**'

jobs:
  build-and-pr:
    name: Build Linux + Windows and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the new branch
      pull-requests: write  # open the PR
    # Skip when triggered by a bot commit (e.g. merge of a previous blobs PR)
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: native/memberlist_wrapper/go.sum

      - name: Install mingw-w64 for Windows cross-compilation
        run: sudo apt-get update -q && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build libgossiper.so (Linux amd64)
        working-directory: native/memberlist_wrapper
        run: |
          go mod tidy
          mkdir -p ../../blobs/linux
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared \
            -o ../../blobs/linux/libgossiper.so .

      - name: Build gossiper.dll (Windows amd64 — cross)
        working-directory: native/memberlist_wrapper
        run: |
          mkdir -p ../../blobs/windows
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc \
            go build -buildmode=c-shared \
            -o ../../blobs/windows/gossiper.dll .

      - name: Commit blobs to a new branch
        id: commit
        run: |
          BRANCH="chore/update-blobs-${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add blobs/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rebuild native blobs"
            git push origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh pr create \
            --title "chore: rebuild native blobs" \
            --body "Automated rebuild of \`blobs/\` triggered by changes to \`native/memberlist_wrapper/\` in ${{ github.sha }}." \
            --base master \
            --head "${{ steps.commit.outputs.branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
