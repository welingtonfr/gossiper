name: Update native blobs

# Rebuilds blobs/ when a PR touches the Go wrapper,
# committing the result back to the PR branch so reviewers see updated blobs.
on:
  pull_request:
    paths:
      - 'native/memberlist_wrapper/**'

jobs:
  build-and-commit:
    name: Build Linux + Windows blobs
    runs-on: ubuntu-latest
    environment: blob-build   # pauses for manager approval before running
    permissions:
      contents: write
    # Skip bot commits to avoid infinite loops
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: native/memberlist_wrapper/go.sum

      - name: Install mingw-w64 for Windows cross-compilation
        run: sudo apt-get update -q && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build libgossiper.so (Linux amd64)
        working-directory: native/memberlist_wrapper
        run: |
          go mod tidy
          mkdir -p ../../blobs/linux
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared \
            -o ../../blobs/linux/libgossiper.so ./src

      - name: Build gossiper.dll (Windows amd64 — cross)
        working-directory: native/memberlist_wrapper
        run: |
          mkdir -p ../../blobs/windows
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc \
            go build -buildmode=c-shared \
            -o ../../blobs/windows/gossiper.dll ./src

      - name: Commit blobs back to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blobs/
          if git diff --staged --quiet; then
            echo "Blobs unchanged — nothing to commit."
          else
            git commit -m "chore: rebuild native blobs [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
