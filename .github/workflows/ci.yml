name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build Linux .so and Windows .dll (cross-compiled) on a single ubuntu runner
  # ──────────────────────────────────────────────────────────────────────────
  build-linux-windows:
    name: Build (Linux + Windows cross)
    runs-on: ubuntu-latest
    environment: blob-build
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: native/memberlist_wrapper/go.sum

      - name: Install mingw-w64 for Windows cross-compilation
        run: sudo apt-get update -q && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build libgossiper.so (Linux amd64)
        working-directory: native/memberlist_wrapper
        run: |
          go mod tidy
          mkdir -p ../../blobs/linux
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared \
            -o ../../blobs/linux/libgossiper.so ./src

      - name: Build gossiper.dll (Windows amd64 — cross)
        working-directory: native/memberlist_wrapper
        run: |
          mkdir -p ../../blobs/windows
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc \
            go build -buildmode=c-shared \
            -o ../../blobs/windows/gossiper.dll ./src

      # Build-only check — blobs are committed to git via update-blobs.yml


  # ──────────────────────────────────────────────────────────────────────────
  # Run Flutter unit tests (no DLL needed — tests use fake bindings)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    environment: blob-build
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test --reporter expanded
