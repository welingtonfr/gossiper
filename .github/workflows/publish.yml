name: Publish to pub.dev

# Triggered when you push a version tag, e.g.: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for pub.dev OIDC publishing

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded

      # Validate the package structure (dry-run)
      - name: Dry-run publish
        run: flutter pub publish --dry-run

      # Publish — uses OIDC (no stored secrets needed; requires pub.dev OIDC setup)
      # See: https://dart.dev/tools/pub/automated-publishing
      - name: Publish
        run: flutter pub publish --force
